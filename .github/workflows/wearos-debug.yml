name: Wear OS debug APK
on:
  push:
    branches:
      - feature/wearos-ha-ble-sync
  pull_request:
    paths:
      - 'wearos/**'
      - '.github/workflows/wearos-debug.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Wear OS debug APK
        run: gradle :wearos:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: watchbridge-wearos-debug
          path: wearos/build/outputs/apk/debug/*.apk
          if-no-files-found: error
