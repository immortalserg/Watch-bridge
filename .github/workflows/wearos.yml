name: Wear OS APK
on:
  push:
    branches: [main, feature/wearos-ble-spo2]
    paths:
      - 'wearos/**'
      - 'shared/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/wearos.yml'
  pull_request:
    paths:
      - 'wearos/**'
      - 'shared/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/wearos.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.WATCH_BRIDGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WATCH_BRIDGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCH_BRIDGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WATCH_BRIDGE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing WATCH_BRIDGE_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing WATCH_BRIDGE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing WATCH_BRIDGE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing WATCH_BRIDGE_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/watchbridge-release.jks"
          chmod 600 "$RUNNER_TEMP/watchbridge-release.jks"
          echo "WATCH_BRIDGE_KEYSTORE_PATH=$RUNNER_TEMP/watchbridge-release.jks" >> "$GITHUB_ENV"
          echo "WATCH_BRIDGE_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          WATCH_BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.WATCH_BRIDGE_KEYSTORE_PASSWORD }}
          WATCH_BRIDGE_KEY_ALIAS: ${{ secrets.WATCH_BRIDGE_KEY_ALIAS }}
          WATCH_BRIDGE_KEY_PASSWORD: ${{ secrets.WATCH_BRIDGE_KEY_PASSWORD }}
        run: gradle :wearos:assembleRelease --no-daemon
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=wearos/build/outputs/apk/release/wearos-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-bridge-wearos-signed
          path: wearos/build/outputs/apk/release/wearos-release.apk
          if-no-files-found: error
      - name: Publish Wear OS GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' wearos/build.gradle.kts | head -1)"
          test -n "$VERSION"
          TAG="wearos-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          mkdir -p dist
          cp wearos/build/outputs/apk/release/wearos-release.apk "dist/WatchBridge-WearOS-v$VERSION.apk"
          cat > dist/release-notes.md <<'EOF'
          ## Watch Bridge for Wear OS v0.3.0

          Tested on Samsung Galaxy Watch4 Classic.

          - Heart rate and SpO₂ measurements and local history
          - Steps, BIA and ECG measurement and history
          - ECG waveform CSV export and experimental heartbeat timing over MQTT
          - MQTT / Home Assistant switch, TLS, credentials and connection test
          - Independent Bluetooth settings and nine appearance themes

          **Known limitations:** Samsung Health authoritative history, durable background synchronization and Home Assistant BLE receiver are not yet implemented. ECG peak detection is experimental and not intended for diagnosis.
          EOF
          gh release create "$TAG" "dist/WatchBridge-WearOS-v$VERSION.apk" \
            --title "Watch Bridge for Wear OS v$VERSION" \
            --notes-file dist/release-notes.md \
            --target "$GITHUB_SHA"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/watchbridge-release.jks"
